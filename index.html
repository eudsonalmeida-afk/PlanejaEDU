                objetivos: ["Aproveitar semana da prova para retomada focada.", "Resolver questões complexas de gráficos e cálculos."],
                materiais: "Banco de questões de fixação, gráficos.",
                abertura: {
                    titulo: "1. Abertura & Engajamento (10 min): Warm-up Gráfico",
                    detalhes: "Análise relâmpago de 2 gráficos de ciclo menstrual."
                },
                desenvolvimento: {
                    titulo: "2. Desenvolvimento & Prática Guiada (30 min): Resolução em Grupos",
                    detalhes: "Trabalho em equipes em questões de far transfer."
                },
                fechamento: {
                    titulo: "3. Fechamento & Consolidação (10 min): Mural de Dúvidas Rápidas",
                    detalhes: "Solução expressa das incertezas finais."
                },
                estrategias_cognitivas: "Spaced Retrieval de véspera.", avaliacao_formativa: "Prontidão.",
                tarefa_casa: "Revisão leve para 11/11.", link: ""
            },
            {
                id: "ag3-94", aula_num: "Aula Extra 02", excel_ref: "Extra 02", modulo: "Extra",
                titulo: "Aula Extra de Retomada Final & Tira-Dúvidas (Véspera)", foco_pedagogico: "Confiança Cognitiva (Prova 11/11)",
                datas: { "8B": "10/11 (Ter - 07:10 e 08:00)", "8AM": "09/11 (Seg - 10:20)", "8AT": "05/11 (Qui - 17:10)" },
                objetivos: ["Concluir ciclo de retomada pré-AG3.", "Revisar Módulo 18 cumulativo e segurança para a prova."],
                materiais: "Esquemas de gametogênese comparada.",
                abertura: {
                    titulo: "1. Abertura & Engajamento (8 min): Desafio Ativo",
                    detalhes: "Diferenciação mnemônica entre espermatogênese e ovulogênese."
                },
                desenvolvimento: {
                    titulo: "2. Desenvolvimento & Prática Guiada (30 min): Revisão Relâmpago Crítica",
                    detalhes: "Repaso final dos pontos nevrálgicos para a prova de amanhã."
                },
                fechamento: {
                    titulo: "3. Fechamento & Consolidação (10 min): Checklist Metacognitivo",
                    detalhes: "Validação individual de autoeficácia."
                },
                estrategias_cognitivas: "Redução de ansiedade.", avaliacao_formativa: "Checklist.",
                tarefa_casa: "Sucesso na Prova Oficial AG3 amanhã!", link: ""
            }
        ];

        // Estado Global
        let cicloAtual = 'AP3';
        let turmaAtual = 'todas';
        let concluidasState = JSON.parse(localStorage.getItem('concluidas_eudson_8ano') || '{}');

        const modulosAP3 = ["Introdução", "Módulo 15", "Módulo 16", "Módulo 17", "Módulo 18", "Módulo 19", "Retomada", "Módulo 20"];
        const modulosAG3 = ["Módulo 20", "Módulo 21", "Módulo 22", "Módulo 23", "Módulo 24", "Módulo 18", "Revisão", "Extra"];

        function atualizarSelectModulos() {
            const select = document.getElementById('moduloSelect');
            select.innerHTML = '<option value="todos">Todos os Módulos</option>';
            const modulos = cicloAtual === 'AP3' ? modulosAP3 : modulosAG3;
            modulos.forEach(mod => {
                select.innerHTML += `<option value="${mod}">${mod}</option>`;
            });
        }

        function switchCiclo(ciclo) {
            cicloAtual = ciclo;
            document.getElementById('tabAP3').className = ciclo === 'AP3' ? "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-emerald-600 text-white shadow-lg" : "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white";
            document.getElementById('tabAG3').className = ciclo === 'AG3' ? "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-indigo-600 text-white shadow-lg" : "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white";
            
            document.getElementById('cicloBadge').innerText = ciclo === 'AP3' ? "Ciclo AP3" : "Ciclo AG3";
            document.getElementById('cicloBadge').className = ciclo === 'AP3' ? "bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-0.5 rounded-full border border-emerald-500/30 font-medium" : "bg-indigo-500/20 text-indigo-300 text-xs px-2.5 py-0.5 rounded-full border border-indigo-500/30 font-medium";
            
            document.getElementById('statLabelAulas').innerText = ciclo === 'AP3' ? "Aulas no Ciclo AP3" : "Aulas no Ciclo AG3";

            atualizarSelectModulos();
            renderAulas();
        }

        function setTurma(turma) {
            turmaAtual = turma;
            document.querySelectorAll('.turma-btn').forEach(btn => {
                btn.className = "turma-btn bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs sm:text-sm px-3.5 py-2 rounded-lg font-medium transition border border-slate-800 whitespace-nowrap";
            });
            const activeColor = cicloAtual === 'AP3' ? 'bg-emerald-600 text-white shadow-lg border-emerald-500' : 'bg-indigo-600 text-white shadow-lg border-indigo-500';
            document.getElementById(`btn-${turma}`).className = `turma-btn ${activeColor} text-xs sm:text-sm px-3.5 py-2 rounded-lg font-medium transition whitespace-nowrap`;
            renderAulas();
        }

        function renderAulas() {
            const grid = document.getElementById('aulasGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const moduloVal = document.getElementById('moduloSelect').value;

            const dataSource = cicloAtual === 'AP3' ? aulasAP3 : aulasAG3;
            grid.innerHTML = '';

            const filtradas = dataSource.filter(aula => {
                const matchSearch = aula.titulo.toLowerCase().includes(searchVal) || 
                                    aula.modulo.toLowerCase().includes(searchVal) ||
                                    aula.foco_pedagogico.toLowerCase().includes(searchVal) ||
                                    aula.aula_num.toLowerCase().includes(searchVal);
                
                const matchModulo = moduloVal === 'todos' || aula.modulo.includes(moduloVal);
                return matchSearch && matchModulo;
            });

            document.getElementById('totalAulasCount').innerText = dataSource.length;
            let concluidasNum = dataSource.filter(a => concluidasState[a.id]).length;
            document.getElementById('concluidasCount').innerText = concluidasNum;

            if (filtradas.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-500">
                        <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                        <p class="text-sm">Nenhum plano de aula encontrado com os filtros selecionados.</p>
                    </div>
                `;
                return;
            }

            filtradas.forEach(aula => {
                const isConcluido = concluidasState[aula.id] || false;
                const temAcessorio = aula.acessorio ? true : false;
                const accentColor = cicloAtual === 'AP3' ? 'emerald' : 'indigo';

                let badgeColor = "bg-slate-800 text-slate-300 border-slate-700";
                if(aula.modulo.includes("Módulo 15") || aula.modulo.includes("Módulo 20")) badgeColor = "bg-cyan-500/20 text-cyan-300 border-cyan-500/30";
                if(aula.modulo.includes("Módulo 16") || aula.modulo.includes("Módulo 21")) badgeColor = "bg-pink-500/20 text-pink-300 border-pink-500/30";
                if(aula.modulo.includes("Módulo 17") || aula.modulo.includes("Módulo 22")) badgeColor = "bg-amber-500/20 text-amber-300 border-amber-500/30";
                if(aula.modulo.includes("Módulo 18") || aula.modulo.includes("Módulo 23")) badgeColor = "bg-purple-500/20 text-purple-300 border-purple-500/30";
                if(aula.modulo.includes("Módulo 19") || aula.modulo.includes("Módulo 24")) badgeColor = "bg-rose-500/20 text-rose-300 border-rose-500/30";
                if(aula.modulo.includes("Retomada") || aula.modulo.includes("Revisão")) badgeColor = "bg-indigo-500/20 text-indigo-300 border-indigo-500/30";

                // Estilização diferenciada (borda âmbar/dourada) para aulas com atividades acessórias especiais
                let cardBorderClass = "border-slate-800";
                if (temAcessorio) {
                    cardBorderClass = "border-amber-500/70 bg-amber-950/10 shadow-amber-500/5";
                } else if (isConcluido) {
                    cardBorderClass = "border-emerald-500/60 bg-emerald-950/10";
                }

                let datasHtml = '';
                if (turmaAtual === 'todas') {
                    datasHtml = `
                        <div class="text-xs text-slate-400 space-y-1 mt-2 bg-slate-950/60 p-2.5 rounded border border-slate-800">
                            <div><strong class="text-slate-300">8ºB:</strong> ${aula.datas['8B']}</div>
                            <div><strong class="text-slate-300">8ºA (M):</strong> ${aula.datas['8AM']}</div>
                            <div><strong class="text-slate-300">8ºA (T):</strong> ${aula.datas['8AT']}</div>
                        </div>
                    `;
                } else {
                    const labelTurma = turmaAtual === '8B' ? '8ºB (Manhã)' : (turmaAtual === '8AM' ? '8ºA (Manhã)' : '8ºA (Tarde)');
                    datasHtml = `
                        <div class="text-xs text-${accentColor}-400 font-medium mt-2 bg-${accentColor}-950/30 p-2.5 rounded border border-${accentColor}-800/40">
                            <i class="fa-regular fa-clock mr-1"></i> <strong>${labelTurma}:</strong> ${aula.datas[turmaAtual]}
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `bg-slate-900/80 hover:bg-slate-900 border ${cardBorderClass} hover:border-${accentColor}-500/50 rounded-xl p-5 transition flex flex-col justify-between group shadow-lg relative overflow-hidden`;

                card.innerHTML = `
                    <div onclick="openModal('${aula.id}')" class="cursor-pointer">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="bg-${accentColor}-500/20 text-${accentColor}-300 border border-${accentColor}-500/30 font-bold text-xs px-2.5 py-1 rounded-full">${aula.aula_num}</span>
                            <span class="text-xs border px-2 py-0.5 rounded ${badgeColor}">${aula.modulo} (${aula.excel_ref})</span>
                        </div>
                        ${temAcessorio ? `
                            <div class="mb-2 inline-flex items-center gap-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-semibold px-2.5 py-0.5 rounded-full">
                                <i class="fa-solid fa-puzzle-piece text-amber-400"></i> ${aula.acessorio.tipo}
                            </div>
                        ` : ''}
                        <h3 class="font-semibold text-slate-100 text-base group-hover:text-${accentColor}-400 transition mb-2">${aula.titulo}</h3>
                        <p class="text-xs sm:text-sm text-slate-400 line-clamp-2 mb-3"><i class="fa-solid fa-brain text-${accentColor}-400 mr-1"></i> ${aula.foco_pedagogico}</p>
                    </div>
                    <div>
                        <div onclick="openModal('${aula.id}')" class="cursor-pointer">
                            ${datasHtml}
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs sm:text-sm">
                            <button onclick="toggleConcluido('${aula.id}')" class="flex items-center gap-1.5 font-medium ${isConcluido ? 'text-emerald-400' : 'text-slate-400 hover:text-white'} transition">
                                <i class="fa-solid ${isConcluido ? 'fa-square-check text-lg' : 'fa-square text-lg'}"></i>
                                <span>${isConcluido ? 'Concluído (OK)' : 'Marcar OK'}</span>
                            </button>
                            ${aula.link ? `<a href="${aula.link}" target="_blank" class="text-sky-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-link text-xs"></i> Link</a>` : ''}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function toggleConcluido(id) {
            concluidasState[id] = !concluidasState[id];
            localStorage.setItem('concluidas_eudson_8ano', JSON.stringify(concluidasState));
            renderAulas();
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                el.classList.add('hidden');
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }

        function openModal(id) {
            const dataSource = cicloAtual === 'AP3' ? aulasAP3 : aulasAG3;
            const aula = dataSource.find(a => a.id === id);
            if (!aula) return;

            document.getElementById('modalNumberBadge').innerText = `${aula.aula_num} • Ref: ${aula.excel_ref}`;
            document.getElementById('modalModuloTag').innerText = aula.modulo;

            const accentColor = cicloAtual === 'AP3' ? 'emerald' : 'indigo';

            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="bg-slate-800/80 p-4 sm:p-5 rounded-xl border border-slate-700 space-y-3">
                    <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-graduation-cap text-${accentColor}-400"></i>
                        ${aula.titulo}
                    </h2>
                    <div class="flex flex-wrap items-center gap-4 text-xs sm:text-sm text-slate-300 pt-2 border-t border-slate-700/60">
                        <div><strong class="text-slate-400">Ciclo:</strong> ${cicloAtual}</div>
                        <div><strong class="text-slate-400">Docente:</strong> Prof. Eudson Marques</div>
                        <div><strong class="text-slate-400">Foco Cognitivo:</strong> <span class="text-${accentColor}-300 font-semibold">${aula.foco_pedagogico}</span></div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs pt-2 text-slate-400">
                        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800"><strong>Turma 8ºB:</strong> ${aula.datas['8B']}</div>
                        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800"><strong>Turma 8ºA (M):</strong> ${aula.datas['8AM']}</div>
                        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800"><strong>Turma 8ºA (T):</strong> ${aula.datas['8AT']}</div>
                    </div>
                    ${aula.link ? `<div class="pt-2"><a href="${aula.link}" target="_blank" class="inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-500 text-white text-xs sm:text-sm px-3.5 py-2 rounded-lg transition font-medium"><i class="fa-solid fa-link"></i> Acessar Link Externo de Apoio</a></div>` : ''}
                </div>

                <!-- BLOCO EXCLUSIVO DE ATIVIDADE ACESSÓRIA (SE HOUVER) -->
                ${aula.acessorio ? `
                    <div class="bg-amber-950/30 border-l-4 border-amber-500 border border-amber-500/40 p-4 sm:p-5 rounded-xl space-y-2 shadow-lg">
                        <h3 class="text-xs sm:text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-puzzle-piece"></i> Ferramenta Acessória: ${aula.acessorio.tipo}
                        </h3>
                        <p class="text-xs sm:text-sm font-semibold text-amber-200">${aula.acessorio.titulo}</p>
                        <div class="text-xs sm:text-sm text-slate-300 leading-relaxed pt-2 border-t border-amber-500/30 whitespace-pre-line">
                            <strong>Orientações de Execução:</strong><br>
                            ${aula.acessorio.instrucoes}
                        </div>
                    </div>
                ` : ''}

                <div>
                    <h3 class="text-xs sm:text-sm font-bold text-${accentColor}-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-bullseye"></i> Objetivos de Aprendizagem
                    </h3>
                    <ul class="list-disc list-inside space-y-1.5 bg-slate-800/40 p-4 rounded-lg border border-slate-800 text-slate-200 text-xs sm:text-sm">
                        ${aula.objetivos.map(obj => `<li>${obj}</li>`).join('')}
                    </ul>
                </div>

                <div>
                    <h3 class="text-xs sm:text-sm font-bold text-purple-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-box-open"></i> Materiais &amp; Recursos Didáticos
                    </h3>
                    <p class="bg-slate-800/40 p-4 rounded-lg border border-slate-800 text-slate-300 text-xs sm:text-sm">${aula.materiais}</p>
                </div>

                <!-- DESENVOLVIMENTO METODOLÓGICO (ACCORDIONS) -->
                <div>
                    <h3 class="text-xs sm:text-sm font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-list-check"></i> Desenvolvimento Metodológico Detalhado (Ciência da Aprendizagem)
                    </h3>
                    <div class="space-y-3">
                        <div class="bg-slate-800/50 rounded-xl border-l-4 border-emerald-500 border border-slate-800 overflow-hidden transition">
                            <div onclick="toggleAccordion('step1')" class="p-3.5 sm:p-4 flex justify-between items-center cursor-pointer hover:bg-slate-800/80 transition">
                                <span class="font-bold text-emerald-400 text-xs sm:text-sm">${aula.abertura.titulo}</span>
                                <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition" id="step1-icon"></i>
                            </div>
                            <div id="step1" class="hidden p-4 pt-0 text-xs sm:text-sm text-slate-300 leading-relaxed border-t border-slate-700/50 mt-2 bg-slate-900/40 whitespace-pre-line">
                                <p class="pt-2">${aula.abertura.detalhes}</p>
                            </div>
                        </div>

                        <div class="bg-slate-800/50 rounded-xl border-l-4 border-amber-500 border border-slate-800 overflow-hidden transition">
                            <div onclick="toggleAccordion('step2')" class="p-3.5 sm:p-4 flex justify-between items-center cursor-pointer hover:bg-slate-800/80 transition">
                                <span class="font-bold text-amber-400 text-xs sm:text-sm">${aula.desenvolvimento.titulo}</span>
                                <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition" id="step2-icon"></i>
                            </div>
                            <div id="step2" class="hidden p-4 pt-0 text-xs sm:text-sm text-slate-300 leading-relaxed border-t border-slate-700/50 mt-2 bg-slate-900/40 whitespace-pre-line">
                                <p class="pt-2">${aula.desenvolvimento.detalhes}</p>
                            </div>
                        </div>

                        <div class="bg-slate-800/50 rounded-xl border-l-4 border-blue-500 border border-slate-800 overflow-hidden transition">
                            <div onclick="toggleAccordion('step3')" class="p-3.5 sm:p-4 flex justify-between items-center cursor-pointer hover:bg-slate-800/80 transition">
                                <span class="font-bold text-blue-400 text-xs sm:text-sm">${aula.fechamento.titulo}</span>
                                <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition" id="step3-icon"></i>
                            </div>
                            <div id="step3" class="hidden p-4 pt-0 text-xs sm:text-sm text-slate-300 leading-relaxed border-t border-slate-700/50 mt-2 bg-slate-900/40 whitespace-pre-line">
                                <p class="pt-2">${aula.fechamento.detalhes}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div class="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                        <h4 class="text-xs sm:text-sm font-bold text-${accentColor}-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-brain"></i> Ciência da Aprendizagem
                        </h4>
                        <p class="text-xs sm:text-sm text-slate-300">${aula.estrategias_cognitivas}</p>
                    </div>
                    <div class="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                        <h4 class="text-xs sm:text-sm font-bold text-rose-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-check-double"></i> Avaliação Formativa
                        </h4>
                        <p class="text-xs sm:text-sm text-slate-300">${aula.avaliacao_formativa}</p>
                    </div>
                </div>

                <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 flex items-center gap-3">
                    <div class="bg-sky-500/20 text-sky-400 p-2.5 rounded-lg text-xl"><i class="fa-solid fa-house-chimney"></i></div>
                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase block">Atividade de Casa / Tarefa</span>
                        <span class="text-xs sm:text-sm font-medium text-slate-200">${aula.tarefa_casa}</span>
                    </div>
                </div>
            `;

            document.getElementById('lessonModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('lessonModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            atualizarSelectModulos();
            renderAulas();
        });
    </script>
</body>
</html>
